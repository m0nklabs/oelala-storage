name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create Release
    runs-on: [self-hosted, Linux, ci, go]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      
      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_num=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
      
      - name: Build all platforms
        env:
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          LDFLAGS="-X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -s -w"
          
          # Linux amd64
          GOOS=linux GOARCH=amd64 go build -ldflags "${LDFLAGS}" \
            -o bin/oelala-storage-linux-amd64 ./cmd/oelala-storage
          
          # Linux arm64
          GOOS=linux GOARCH=arm64 go build -ldflags "${LDFLAGS}" \
            -o bin/oelala-storage-linux-arm64 ./cmd/oelala-storage
          
          # Windows amd64
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" \
            -o bin/oelala-storage-windows-amd64.exe ./cmd/oelala-storage
          
          # Android arm64
          GOOS=android GOARCH=arm64 go build -ldflags "${LDFLAGS}" \
            -o bin/oelala-storage-android-arm64 ./cmd/oelala-storage
      
      - name: Create checksums
        run: |
          cd bin
          sha256sum * > checksums.txt
          cat checksums.txt
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          if [ -z "$PREV_TAG" ]; then
            # First release - get all commits
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --reverse)
          else
            # Generate changelog from previous tag to current
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --reverse)
          fi
          
          # Save to file for release notes
          echo "## What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "$CHANGELOG" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Download" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Choose the binary for your platform:" >> CHANGELOG.md
          echo "- **Linux (amd64)**: \`oelala-storage-linux-amd64\`" >> CHANGELOG.md
          echo "- **Linux (arm64)**: \`oelala-storage-linux-arm64\`" >> CHANGELOG.md
          echo "- **Windows (amd64)**: \`oelala-storage-windows-amd64.exe\`" >> CHANGELOG.md
          echo "- **Android (arm64)**: \`oelala-storage-android-arm64\`" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "## Docker" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Pull the Docker image:" >> CHANGELOG.md
          echo '```bash' >> CHANGELOG.md
          echo "docker pull ghcr.io/m0nklabs/oelala-storage:${{ steps.get_version.outputs.version }}" >> CHANGELOG.md
          echo "docker pull ghcr.io/m0nklabs/oelala-storage:latest" >> CHANGELOG.md
          echo '```' >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "Verify downloads with \`checksums.txt\`" >> CHANGELOG.md
          
          cat CHANGELOG.md
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/m0nklabs/oelala-storage
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.get_version.outputs.version }}
            BUILD_TIME=${{ steps.get_version.outputs.build_time }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          files: |
            bin/oelala-storage-linux-amd64
            bin/oelala-storage-linux-arm64
            bin/oelala-storage-windows-amd64.exe
            bin/oelala-storage-android-arm64
            bin/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
