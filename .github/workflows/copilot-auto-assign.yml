name: Auto-assign Copilot to Issues

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  pull_request:
    types: [closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  assign-copilot:
    runs-on: [self-hosted, Linux, ci, go]
    steps:
      - name: Check for active Copilot PRs
        id: check-prs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          COPILOT_PRS=$(gh api repos/${{ github.repository }}/pulls \
            --jq '[.[] | select(.state == "open" and ((.user.login | ascii_downcase | contains("copilot")) or (.head.ref | startswith("copilot/"))))] | length')
          
          echo "Active Copilot PRs: $COPILOT_PRS"
          
          if [ "$COPILOT_PRS" -gt 0 ]; then
            echo "busy=true" >> $GITHUB_OUTPUT
          else
            echo "busy=false" >> $GITHUB_OUTPUT
          fi

      - name: Find unassigned issue with copilot label
        id: find-issue
        if: steps.check-prs.outputs.busy == 'false'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUES=$(gh api repos/${{ github.repository }}/issues \
            --jq '[.[] | select(.pull_request == null and (.labels | map(.name) | any(. == "copilot")) and ((.assignees | length) == 0 or (.assignees | map(.login | ascii_downcase) | any(contains("copilot")) | not)))] | sort_by(.number) | .[0]')
          
          if [ "$ISSUES" == "null" ] || [ -z "$ISSUES" ]; then
            echo "No unassigned copilot-labeled issues found"
            echo "found=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          ISSUE_NUMBER=$(echo "$ISSUES" | jq -r '.number')
          ISSUE_TITLE=$(echo "$ISSUES" | jq -r '.title')
          
          echo "Selected issue #$ISSUE_NUMBER: $ISSUE_TITLE"
          echo "found=true" >> $GITHUB_OUTPUT
          echo "issue_number=$ISSUE_NUMBER" >> $GITHUB_OUTPUT
          echo "issue_title=$ISSUE_TITLE" >> $GITHUB_OUTPUT

      - name: Mention Copilot on issue
        if: steps.check-prs.outputs.busy == 'false' && steps.find-issue.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          ISSUE_NUMBER=${{ steps.find-issue.outputs.issue_number }}
          
          gh issue comment "$ISSUE_NUMBER" \
            --body "@copilot Please implement this issue. Create a fresh branch from main and open a PR when ready. _Auto-triggered by CI_"
          
          echo "Mentioned Copilot on issue #$ISSUE_NUMBER"

      - name: Summary
        if: always()
        run: |
          echo "### Copilot Auto-Assignment" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-prs.outputs.busy }}" == "true" ]; then
            echo "⏳ Copilot is busy with an open PR" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.find-issue.outputs.found }}" == "true" ]; then
            echo "✅ Assigned Copilot to issue #${{ steps.find-issue.outputs.issue_number }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "📭 No unassigned copilot-labeled issues found" >> $GITHUB_STEP_SUMMARY
          fi
