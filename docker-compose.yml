# docker-compose.yml - oelala-storage deployment example
#
# Usage:
#   docker-compose up -d          # Start in background
#   docker-compose logs -f        # View logs
#   docker-compose down           # Stop
#
# For production, use your own config file:
#   cp oelala-storage.yaml.example oelala-storage.yaml
#   # Edit config, then:
#   docker-compose up -d

services:
  oelala-storage:
    image: ghcr.io/m0nklabs/oelala-storage:latest
    container_name: oelala-storage
    restart: unless-stopped
    ports:
      - "7990:7990"   # HTTP API
      - "7991:7991"   # gRPC Sync
      - "7992:7992"   # Prometheus Metrics
    volumes:
      - storage-data:/data
      # Mount custom config if needed:
      # - ./oelala-storage.yaml:/app/oelala-storage.yaml:ro
    environment:
      # Override config via environment variables
      # (prefix with OELALA_STORAGE_)
      - OELALA_STORAGE_STORAGE_PATH=/data
      - OELALA_STORAGE_API_HTTP_PORT=7990
      - OELALA_STORAGE_API_GRPC_PORT=7991
      - OELALA_STORAGE_METRICS_PORT=7992
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7990/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  storage-data:
    driver: local

