version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  enable:
    - errcheck      # Check for unchecked errors
    - govet         # Vet examines Go source code
    - ineffassign   # Detect ineffectual assignments
    - staticcheck   # Go static analysis (includes gosimple)
    - unused        # Check for unused code
    - misspell      # Check for misspelled words
    - gocritic      # Opinionated code checker
    - revive        # Fast, configurable, extensible linter

formatters:
  enable:
    - gofmt         # Check code is gofmt-ed
    - goimports     # Check imports are formatted

linters-settings:
  errcheck:
    check-blank: true
    check-type-assertions: true
    exclude-functions:
      - (io.Closer).Close
      - (*os.File).Close
      - os.Remove
      - os.RemoveAll
      - fmt.Fprintf
      - fmt.Fprintln
  
  govet:
    enable-all: true
  
  goimports:
    local-prefixes: github.com/m0nklabs/oelala-storage
  
  misspell:
    locale: US
  
  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - ifElseChain
      - singleCaseSwitch

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
  
  max-issues-per-linter: 0
  max-same-issues: 0

output:
  sort-results: true
